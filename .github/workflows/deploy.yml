name: Deploy Z-Mirror to Heroku

on:
  workflow_dispatch:
    inputs:
      APP_NAME:
        description: Heroku App Name
        required: true
        type: string

      HEROKU_API_KEY:
        description: Heroku API Key
        required: true
        type: string

      HEROKU_EMAIL:
        description: Heroku Account Email
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Z-Mirror
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      APP_NAME: ${{ inputs.APP_NAME }}
      HEROKU_API_KEY: ${{ inputs.HEROKU_API_KEY }}
      HEROKU_EMAIL: ${{ inputs.HEROKU_EMAIL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        run: |
          echo "::add-mask::$HEROKU_API_KEY"

          if [ -z "$APP_NAME" ] || [ -z "$HEROKU_API_KEY" ] || [ -z "$HEROKU_EMAIL" ]; then
            echo "ERROR: Required inputs are missing."
            exit 1
          fi

          echo "App name: $APP_NAME"
          echo "Email: $HEROKU_EMAIL"
          echo "Inputs validated."

      - name: Install Heroku CLI
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku --version

      - name: Prepare Z-Mirror for Heroku
        run: |
          python3 - <<'PY'
          from pathlib import Path

          init_file = Path("bot/__init__.py")
          start_file = Path("start.sh")

          source = init_file.read_text()

          old = '''BASE_URL_PORT = environ.get(
              "BASE_URL_PORT",
              ""
          )
          BASE_URL_PORT = (
              80
              if len(BASE_URL_PORT) == 0
              else int(BASE_URL_PORT)
          )'''

          new = '''BASE_URL_PORT = int(
              environ.get("BASE_URL_PORT")
              or environ.get("PORT")
              or 80
          )'''

          if old not in source:
              raise SystemExit(
                  "ERROR: Could not locate the original BASE_URL_PORT code."
              )

          init_file.write_text(source.replace(old, new, 1))

          start_source = start_file.read_text()

          if "python3 update.py" not in start_source:
              raise SystemExit(
                  "ERROR: Could not locate the startup updater command."
              )

          start_file.write_text(
              start_source.replace("python3 update.py", "# updater disabled for Heroku", 1)
          )

          print("Heroku PORT compatibility patch applied.")
          print("Startup updater disabled to preserve the patch.")
          PY

      - name: Check Dockerfile
        run: |
          test -f Dockerfile || {
            echo "ERROR: Dockerfile not found."
            exit 1
          }

          test -f requirements.txt || {
            echo "ERROR: requirements.txt not found."
            exit 1
          }

          echo "Docker build files verified."

      - name: Login to Heroku Container Registry
        run: |
          heroku container:login
        env:
          HEROKU_API_KEY: ${{ inputs.HEROKU_API_KEY }}

      - name: Set Container Stack
        run: |
          heroku stack:set container --app "$APP_NAME"

      - name: Build and Push Docker Image
        run: |
          heroku container:push web --app "$APP_NAME"

      - name: Release Heroku Container
        run: |
          heroku container:release web --app "$APP_NAME"

      - name: Deployment Information
        if: success()
        run: |
          echo "================================"
          echo "Z-MIRROR DEPLOYMENT COMPLETED"
          echo "================================"
          echo "App: $APP_NAME"
          echo "Email: $HEROKU_EMAIL"
          echo "Container released successfully."
